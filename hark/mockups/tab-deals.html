.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.dim{color:var(--dim)}

.chip.g{background:#12361f;color:#86efac}.chip.b{background:#13284a;color:#93c5fd}.chip.r{background:#3b1520;color:#fda4af}.chip.a{background:#3a2a10;color:#fcd34d}.chip.t{background:#0f3a36;color:#5eead4}

    s+=`<rect x="${X-bw*0.35}" y="${Math.min(Y(p[1]),Y(p[4]))}" width="${bw*0.7}" height="${Math.max(1,Math.abs(Y(p[1])-Y(p[4])))}" fill="${tg?TC[tg]:col}"/>`;

  const used=[];[...mk].sort((a,b)=>a.d<b.d?1:-1).slice(0,3).forEach(m=>{if(!m.lvl||['C','T'].includes(TAG[m.ev]))return;const i=px.findIndex(p=>p[0]===m.d);if(i<0)return;const x0=4+i*bw;const yy=Y(m.lvl);
    s+=`<line x1="${x0}" x2="${w-36}" y1="${yy}" y2="${yy}" stroke="${TC[TAG[m.ev]]}" stroke-dasharray="4 3" stroke-width="1.2"/>`+(used.every(u=>Math.abs(u-yy)>10)?(used.push(yy),`<text x="${w-34}" y="${yy+3}" style="fill:${TC[TAG[m.ev]]}">${f1(m.lvl)}</text>`):'')});
  return s+`<text x="4" y="${h-3}">${px[0][0]}</text><text x="${w-90}" y="${h-3}">${px[px.length-1][0]}</text></svg>`;
}
function who(list,title){return `<div class="who"><div class="mut" style="border:0">${title}</div>${list.length?list.map(b=>`<div><span>${b.n} <span class="dim">${b.cls}</span>${b.cls==='FII'||b.cls==='DII'?`<span class="gr ${b.g}">${b.g}</span>`:''}</span><span>₹${f1(b.v)} Cr</span></div>`).join(''):'<div class="dim">none (ex prop desks)</div>'}</div>`}
function drawer(x){
  if(!x)return `<div class="card"><h3>Pick a stock</h3><div class="sub">Its chart with deal candles, who bought and sold, and the deal-price level.</div></div>`;
  const fol={confirm:'Plan it: stop just under '+f1(x.lvl)+'.',watch:'Watch: confirmed if it closes above '+f1(x.lvl)+' for 3 sessions.',place:(x.strong?'Buyable: strong chart, and ':'Wait for the chart to strengthen; ')+'deal price '+f1(x.lvl)+' is the line.',absorbed:'Sellers are done at '+f1(x.lvl)+'; treat it as support.',supply:'Wait: needs a close above '+f1(x.lvl)+' to call it absorbed.',avoid:'Skip.',churn:'Ignore the deal; read the chart alone.',ignore:'Ignore the deal.',none:'No edge from this deal.'}[x.cls];
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3 style="font-size:16px">${x.sym} <span class="mut" style="font-weight:400;font-size:12px">${x.nm}</span></h3><span class="mut">${x.ind||''}</span></div>
  <div class="say" style="margin:6px 0">${verdict(x)}<div style="margin-top:4px;color:#c9d2e6">${x.why}</div></div>
  ${chart(x)}
  <div class="legend"><span style="color:${TC.B}">B</span><span class="dim">net buy</span> <span style="color:${TC.P}">P</span><span class="dim">placement</span> <span style="color:${TC.S}">S</span><span class="dim">net sell</span> <span style="color:${TC.C}">C</span><span class="dim">churn</span> <span style="color:${TC.T}">T</span><span class="dim">transfer</span> · dashed line = deal price</div>
  <div class="kv"><div><span>Deal price</span>₹${f1(x.lvl)}</div><div><span>Now</span>₹${f1(x.c)} <span class="${x.chg>=0?'up':'dn'}">${sg(x.chg)}</span></div><div><span>Status</span>${stat(x)} <span class="dim">${x.ago}d</span></div>
  <div><span>Chart</span>${x.strong?'<span class="up">Strong</span>':'Weak'} · RS ${x.rs??'–'}</div><div><span>From 52W high</span>${sg(x.a52)}</div><div><span>Last month</span>${sg(x.r21)}</div></div>
  ${who(x.buy,'Bought')}${who(x.sell,'Sold')}
  ${(x.hist||[]).length?`<div class="sub" style="margin-top:8px">Earlier in the window: ${x.hist.map(h=>h.d.slice(5)+' '+EV[h.ev]+' '+cr(h.net)).join(' · ')}</div>`:''}
  <div class="do">${fol}</div></div>`;
}
function tableRows(list,cols){return list.map(x=>`<tr data-s="${x.sym}" class="${sel===x.sym?'sel':''}">${cols.map(c=>c(x)).join('')}</tr>`).join('')}
function bind(){document.querySelectorAll('tbody tr[data-s]').forEach(t=>t.onclick=()=>{sel=t.dataset.s;render()})}
let noise=false;
function today(){
  const ALL=[...D.today].sort((a,b)=>ORDER.indexOf(a.cls)-ORDER.indexOf(b.cls)||Math.abs(b.net)-Math.abs(a.net));
  const NZ=['churn','ignore','none'];const T=noise?ALL:ALL.filter(x=>!NZ.includes(x.cls));
  const c=k=>ALL.filter(x=>x.cls===k).length;
  return `<div class="summary"><div><div class="n" style="color:var(--confirm)">${c('watch')+c('confirm')}</div><div class="l">Confirms a setup</div></div><div><div class="n" style="color:var(--place)">${c('place')}</div><div class="l">Placements</div></div><div><div class="n" style="color:var(--supply)">${c('supply')}</div><div class="l">Supply to watch</div></div><div><div class="n" style="color:var(--avoid)">${c('avoid')}</div><div class="l">Avoid</div></div><div><div class="n mut">${c('churn')+c('ignore')+c('none')}</div><div class="l">Noise (churn, transfers, no edge)</div></div></div>
  <div class="card"><h3>Every deal stock today</h3><div class="sub">Sorted by what matters. ${D.mkt.above50}% of stocks ≥ ₹1,000 Cr are above their 50 EMA. Tap a row for the chart.</div>
  <table><thead><tr><th class="l">Stock</th><th class="l">Verdict</th><th class="l">Type</th><th>₹ Cr</th><th>Deal price</th><th>vs close</th><th class="l">Main buyer</th><th class="l">Chips</th></tr></thead><tbody>
  ${tableRows(T,[x=>`<td class="l"><b>${x.sym}</b></td>`,x=>`<td class="l">${verdict(x)}</td>`,x=>`<td class="l mut">${EV[x.ev]}</td>`,x=>{const v=x.ev==='placement'||Math.abs(x.net)<0.5?x.bv:x.net;return `<td class="${v>=0?'up':'dn'}">${v>=0?'+':'−'}${f1(Math.abs(v))}${v!==x.net?' <span class="dim">bought</span>':''}</td>`},x=>`<td>${f1(x.lvl)}</td>`,x=>`<td class="${x.chg>=0?'up':'dn'}">${sg(x.chg)}</td>`,x=>`<td class="l">${x.buy[0]?x.buy[0].n.slice(0,24)+' <span class="dim">'+x.buy[0].cls+'</span>':'<span class="dim">–</span>'}</td>`,x=>`<td class="l">${chips(x)}</td>`])}
  </tbody></table><button class="seg" id="nz" style="margin-top:8px;padding:5px 10px;color:var(--mut)">${noise?'Hide':'Show'} ${ALL.filter(x=>NZ.includes(x.cls)).length} noise rows (churn, transfers, no edge)</button></div>`;
}
let wf='all';
function watch(){
  const F={all:()=>true,holding:x=>x.status==='holding',lost:x=>x.status==='lost'||x.status==='below seller',reclaimed:x=>x.status==='reclaimed',best:x=>['confirm','place','absorbed'].includes(x.cls)};
  const W=D.watch.filter(x=>!['churn','transfer_interse'].includes(x.ev)).filter(F[wf]).sort((a,b)=>ORDER.indexOf(a.cls)-ORDER.indexOf(b.cls)||a.ago-b.ago);
  return `<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><h3>Deal watch · last 10 deal sessions</h3><div class="sub">The deal price is a level. Day 3 decides: holding it upgrades the verdict, losing it downgrades.</div></div>
  <div class="seg" id="wf">${['all','best','holding','lost','reclaimed'].map(k=>`<button data-v="${k}" class="${wf===k?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div></div>
  <table><thead><tr><th class="l">Stock</th><th class="l">Verdict</th><th class="l">Status</th><th>Days</th><th>Deal price</th><th>Now</th><th>vs deal</th><th class="l">Chips</th></tr></thead><tbody>
  ${tableRows(W,[x=>`<td class="l"><b>${x.sym}</b> <span class="dim">${x.d.slice(5)}</span></td>`,x=>`<td class="l">${verdict(x)}</td>`,x=>`<td class="l">${stat(x)}</td>`,x=>`<td>${x.ago}</td>`,x=>`<td>${f1(x.lvl)}</td>`,x=>`<td>${f1(x.c)}</td>`,x=>`<td class="${x.chg>=0?'up':'dn'}">${sg(x.chg)}</td>`,x=>`<td class="l">${chips(x)}</td>`])}
  </tbody></table></div>`;
}
let hsel=null,follow=new Set();
function houses(){
  return `<div class="card"><h3>Who's buying matters more than their record</h3><div class="sub">Buys ≥ ₹5 Cr, 20 sessions later vs the market, Apr 2024 to Jul 2026.</div>
  <table><thead><tr><th class="l">Buyer class</th><th>Deals</th><th>vs market</th><th>Beat %</th></tr></thead><tbody>${D.clsev.map(c=>`<tr><td class="l">${c.c}</td><td>${c.n.toLocaleString('en-IN')}</td><td class="${c.x>=0?'up':'dn'}">${sg(c.x)}</td><td>${c.b}%</td></tr>`).join('')}</tbody></table>
  <div class="do">Grades show for FII/DII only, from finished trades before today. Alerts fire when a good-record or followed FII/DII house buys a strong chart.</div></div>
  <div class="card"><h3>Houses buying in the window</h3><table><thead><tr><th class="l">House</th><th class="l">Class</th><th>Bought ₹ Cr</th><th class="l">Grade</th><th>Past trades</th><th>Avg vs mkt</th><th>Beat %</th><th class="l">Stocks</th><th></th></tr></thead><tbody>
  ${D.houses.map((h,i)=>`<tr data-h="${i}"><td class="l"><b>${h.h}</b></td><td class="l mut">${h.cls}</td><td>${f1(h.v)}</td><td class="l"><span class="gr ${h.grade}">${h.grade}</span></td><td>${h.n||'–'}</td><td class="${h.avg>=0?'up':'dn'}">${h.avg==null?'–':sg(h.avg)}</td><td>${h.beat??'–'}${h.beat!=null?'%':''}</td><td class="l mut">${h.syms.join(', ')}</td><td><button class="seg fb" data-h="${i}" style="padding:2px 8px;color:var(--tx)">${follow.has(i)?'Following':'Follow'}</button></td></tr>`).join('')}</tbody></table></div>`;
}
function groups(){
  return `<div class="card"><h3>Deals by industry · last 10 sessions</h3><div class="sub">Transfers and churn excluded. Context only: 3+ buying names in a group averaged only +0.7% over 20 sessions.</div>
  <table><thead><tr><th class="l">Industry</th><th class="l">Sector</th><th>Buying names</th><th>Selling names</th><th>Net ₹ Cr</th><th class="l">Stocks</th></tr></thead><tbody>
  ${D.groups.map(g=>`<tr><td class="l"><b>${g.ind}</b>${g.b>=3?' <span class="chip g">3+ buyers</span>':''}</td><td class="l mut">${g.sec||''}</td><td class="up">${g.b||'–'}</td><td class="dn">${g.s||'–'}</td><td class="${g.flow>=0?'up':'dn'}">${g.flow>=0?'+':'−'}${f1(Math.abs(g.flow))}</td><td class="l">${g.syms.map(s=>`<a href="#" class="gs" data-s="${s}" style="color:var(--tx)">${s}</a>`).join(', ')}</td></tr>`).join('')}</tbody></table>
  <div class="do">In Sector Intel this becomes a "Deals 10D" column (buying / selling / ₹ Cr) and a list in the group drill.</div></div>`;
}
function tgText(){
  const T=D.today,W=D.watch,d=new Date(D.asof).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
  const line=(e,h,arr,fn)=>arr.length?`${e} ${h}\n${arr.slice(0,4).map(fn).join('\n')}\n`:'';
  const conf=T.filter(x=>x.cls==='watch'),pl=T.filter(x=>x.cls==='place'),
        ab=W.filter(x=>x.cls==='absorbed'),d3=W.filter(x=>x.ago===3&&x.status&&!['churn','ignore'].includes(x.cls)&&x.ev!=='distribute'),
        av=T.filter(x=>x.cls==='avoid');
  const tv=[...conf,...pl,...ab,...W.filter(x=>x.cls==='confirm')].map(x=>'NSE:'+x.sym);
  return `📊 Deals · ${d} · ${D.mkt.above50}% above 50 EMA\n`+
   line('✅','Confirms a setup (watch day 3)',conf,x=>`  ${x.sym}  ${cr(Math.abs(x.net)<0.5?x.bv:x.net)} · ${x.buy[0]?x.buy[0].n.split(' ').slice(0,3).join(' '):''} · hold ₹${f1(x.lvl)}`)+
   line('🏦','Placement',pl,x=>`  ${x.sym}  ${cr(x.gross)} @ ₹${f1(x.lvl)}${x.strong?' · strong chart':''}`)+
   line('🎯','Confirmed (held 3 days)',W.filter(x=>x.cls==='confirm'),x=>`  ${x.sym}  ${sg(x.chg)} over ₹${f1(x.lvl)}`)+
   line('🔁','Absorbed (seller price reclaimed)',ab,x=>`  ${x.sym}  sold @ ₹${f1(x.lvl)}, now ₹${f1(x.c)}`)+
   (d3.length?`👀 Day 3: ${d3.slice(0,5).map(x=>`${x.sym} ${x.status} ${sg(x.chg)}`).join(' · ')}\n`:'')+
   (av.length?`⚠️ Avoid: ${av.slice(0,6).map(x=>x.sym).join(', ')}\n`:'')+
   `Skipped: ${D.skipped.transfer} transfers, ${D.skipped.churn} churn, ${D.skipped.small} under ₹1,000 Cr\n`+
   (tv.length?`TV: ${[...new Set(tv)].join(',')}`:'');
}
function tg(){const t=tgText();return `<div class="card"><h3>Telegram · one message</h3><div class="sub">Built from the same verdicts. ${t.length} characters (today's bot sends 6 messages, about 7,200). Empty sections drop out.</div><pre class="tg">${t}</pre></div>`}
let pop=null;
function els(){
  const pick=[...D.watch].filter(x=>!['ignore','churn'].includes(x.cls)).slice(0,8);
  const ic=x=>`<span class="icon" data-p="${x.sym}" style="background:${VC[x.cls]}">${ICON[x.cls]}${pop===x.sym?`<span class="pop"><b>${x.sym}</b> · ${x.title}<br><span class="mut">${EV[x.ev]} ${cr(x.net)} on ${x.d.slice(5)} @ ₹${f1(x.lvl)} · ${x.status||''} ${sg(x.chg)}</span><br><a href="#" style="color:var(--acc)">Open in Deals →</a></span>`:''}</span>`;
  return `<div class="card"><h3>The deal icon, as it would sit in other tabs</h3><div class="sub">One icon per stock row in Pulse, Setups, Sector Intel, Charts, Stock360 and Plan, only within 10 sessions of a deal. Colour and letter = verdict. Tap it.</div>
  <div class="legend" style="margin-bottom:8px">${Object.entries({confirm:'confirmed',watch:'watch day 3',place:'placement',absorbed:'absorbed',supply:'supply',avoid:'avoid'}).map(([k,v])=>`<span><span class="icon" style="background:${VC[k]};cursor:default">${ICON[k]}</span> ${v}</span>`).join('')}</div>
  <table><thead><tr><th class="l">Setups row (example)</th><th></th><th>RS</th><th>52W</th><th class="l">Industry</th></tr></thead><tbody>${pick.map(x=>`<tr><td class="l"><b>${x.sym}</b></td><td class="l" style="overflow:visible">${ic(x)}</td><td>${x.rs??'–'}</td><td>${sg(x.a52)}</td><td class="l mut">${x.ind||''}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h3>Deal candles on Charts / Stock360</h3><div class="sub">The deal-day candle takes the deal's colour (teal buy, blue placement, orange sell, grey churn/transfer) plus a letter, and the deal price runs as a dashed line for 20 sessions.</div>${pick[0]?chart(pick[0],700,260):''}</div>`;
}
let hN=10,hP='all';
const PAT={rbuy:['Repeated buying','var(--confirm)','Buying in 2+ sessions, no selling. Repeat buying alone showed no edge: use the chart and the deal price.'],
 buy:['Single buy','var(--absorbed)','One net-buy session.'],
 sell:['Selling only','var(--supply)','Net selling, no buying. Supply overhang until price closes above the sellers\' price.'],
 mixed:['Buying and selling','var(--watch)','Both sides in the window. Read the latest session and the deal price.'],
 prop:['Prop desk / churn only','var(--churn)','Same desks in and out. Churn lagged the market (−2.0%; −3.7% on quiet days).'],
 xfer:['Transfers only','var(--ignore)','Shares changing hands; no new money.']};
function hstat(h){const lo=D.sessions20.length-hN;const ev=h.ev.filter(e=>e[0]>=lo);if(!ev.length)return null;
 const b=ev.filter(e=>['fresh','accumulate','placement'].includes(e[1])),s=ev.filter(e=>e[1]==='distribute'),c=ev.filter(e=>e[1]==='churn'),t=ev.filter(e=>e[1]==='transfer_interse');
 const pat=b.length>=2&&!s.length?'rbuy':b.length===1&&!s.length?'buy':s.length&&!b.length?'sell':b.length&&s.length?'mixed':c.length?'prop':'xfer';
 const net=ev.reduce((a,e)=>a+e[2],0),prop=ev.reduce((a,e)=>a+e[3],0);
 const wv=(arr,i)=>{const v=arr.map(e=>e[i]).filter(x=>x);return v.length?v.reduce((a,x)=>a+x,0)/v.length:null};
 const lvl=pat==='sell'?wv(s,5):wv(b,4);
 return {sym:h.sym,ind:h.ind,c:h.c,ev,lo,pat,nb:b.length,ns:s.length,nc:c.length,net,prop,lvl,vs:lvl?(h.c/lvl-1)*100:null}}
function strip(x){let s='';for(let i=x.lo;i<D.sessions20.length;i++){const e=x.ev.find(z=>z[0]===i);const tg=e?TAG[e[1]]:null;
 s+=`<span title="${D.sessions20[i]}${e?' '+EV[e[1]]:''}" style="display:inline-block;width:${hN>10?9:14}px;height:16px;margin-right:2px;border-radius:3px;background:${tg?TC[tg]:'#1d2331'};color:#0b0d12;font-size:9px;font-weight:800;text-align:center;line-height:16px">${tg||''}</span>`}return s}
function history(){
 const R=D.hist20.map(hstat).filter(Boolean);const cnt=k=>R.filter(x=>x.pat===k).length;
 const L=R.filter(x=>hP==='all'||x.pat===hP).sort((a,b)=>Object.keys(PAT).indexOf(a.pat)-Object.keys(PAT).indexOf(b.pat)||(b.nb+b.ns)-(a.nb+a.ns)||Math.abs(b.net)-Math.abs(a.net));
 return `<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><h3>Deal history · last ${hN} deal sessions</h3><div class="sub">Every stock ≥ ₹1,000 Cr with a deal, including churn, prop desks and transfers. One square per session, oldest first.</div></div>
 <div class="seg" id="hn">${[5,10,20].map(n=>`<button data-v="${n}" class="${hN===n?'on':''}">${n} sessions</button>`).join('')}</div></div>
 <div class="seg" id="hp" style="margin:6px 0 10px">${[['all','All '+R.length],...Object.entries(PAT).map(([k,v])=>[k,v[0]+' '+cnt(k)])].map(([k,l])=>`<button data-v="${k}" class="${hP===k?'on':''}">${l}</button>`).join('')}</div>
 ${hP!=='all'?`<div class="do" style="margin:0 0 10px">${PAT[hP][2]}</div>`:''}
 <table><thead><tr><th class="l">Stock</th><th class="l">Pattern</th><th class="l">Sessions</th><th>Buy</th><th>Sell</th><th>Net ₹ Cr</th><th>Prop ₹ Cr</th><th>Avg deal price</th><th>Now vs deal</th></tr></thead><tbody>
 ${L.map(x=>`<tr data-s="${x.sym}" class="${sel===x.sym?'sel':''}"><td class="l"><b>${x.sym}</b></td><td class="l"><span class="v"><span class="dot" style="background:${PAT[x.pat][1]}"></span>${PAT[x.pat][0]}</span></td><td class="l">${strip(x)}</td><td class="up">${x.nb||'–'}</td><td class="dn">${x.ns||'–'}</td><td class="${x.net>=0?'up':'dn'}">${Math.abs(x.net)<0.05?'0':(x.net>0?'+':'−')+f1(Math.abs(x.net))}</td><td class="mut">${x.prop?f1(x.prop):'–'}</td><td>${x.lvl?f1(x.lvl):'–'}</td><td class="${x.vs>=0?'up':'dn'}">${x.vs==null?'–':sg(x.vs)}</td></tr>`).join('')}
 </tbody></table></div>`}
function render(){
  $('#main').innerHTML={today,watch,history,houses,groups,tg,else:els}[tab]();
  if(!sel){const f=(tab==='watch'?D.watch:D.today).find(x=>['confirm','watch','place','absorbed'].includes(x.cls))||D.today[0];sel=f&&f.sym}
  $('#side').innerHTML=['today','watch','groups','history'].includes(tab)?drawer(bySym(sel)):tab==='houses'?houseDrawer():'';
  bind();
  const nz=document.getElementById('nz');if(nz)nz.onclick=()=>{noise=!noise;render()};
  document.querySelectorAll('#hn button').forEach(b=>b.onclick=()=>{hN=+b.dataset.v;render()});
  document.querySelectorAll('#hp button').forEach(b=>b.onclick=()=>{hP=b.dataset.v;render()});
  document.querySelectorAll('#wf button').forEach(b=>b.onclick=()=>{wf=b.dataset.v;render()});
  document.querySelectorAll('a.gs').forEach(a=>a.onclick=e=>{e.preventDefault();sel=a.dataset.s;render()});
  document.querySelectorAll('tr[data-h]').forEach(t=>t.onclick=()=>{hsel=+t.dataset.h;render()});
  document.querySelectorAll('button.fb').forEach(b=>b.onclick=e=>{e.stopPropagation();const i=+b.dataset.h;follow.has(i)?follow.delete(i):follow.add(i);render()});
  document.querySelectorAll('.icon[data-p]').forEach(i=>i.onclick=()=>{pop=pop===i.dataset.p?null:i.dataset.p;render()});
}
function houseDrawer(){
  const h=D.houses[hsel??0];if(!h)return'';
  const recent=h.syms.map(s=>bySym(s)).filter(Boolean);
  return `<div class="card"><h3 style="font-size:16px">${h.h}</h3><div class="sub">${h.cls} · bought ₹${f1(h.v)} Cr in the window</div>
  <div class="kv"><div><span>Grade</span><span class="gr ${h.grade}" style="margin:0">${h.grade}</span></div><div><span>Finished trades</span>${h.n||'–'}</div><div><span>Avg vs market</span>${h.avg==null?'–':sg(h.avg)}</div></div>
  <div class="who"><div class="mut" style="border:0">Recent buys · status since the deal</div>${recent.map(x=>`<div><span><b>${x.sym}</b> ${verdict(x)}</span><span>${stat(x)} ${sg(x.chg)}</span></div>`).join('')||'<div class="dim">none in watch</div>'}</div>
  <div class="do">${h.grade==='good'?'Alert on: buys a strong chart, and day 3 holding or lost.':h.cls==='FII'||h.cls==='DII'?'Follow to get alerts when it buys a strong chart.':'No grade: corporate and trading-firm buys lagged the market as a group (−2.6% / −2.7%).'}</div></div>`;
}
render();
</script></body></html>
