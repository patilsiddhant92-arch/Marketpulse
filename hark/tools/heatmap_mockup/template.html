<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MarketPulse · Stock Heatmap (mockup)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--tx:#e6edf3;--mut:#8b949e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.35 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:15px;margin:0 8px 0 0}.ctl{display:flex;gap:6px;align-items:center;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mut);padding:4px 9px;cursor:pointer;font:inherit}
.seg button.on{background:#238636;color:#fff}
#legend{display:flex;align-items:center;gap:0;margin-left:auto}#legend span{width:34px;text-align:center;font-size:11px;padding:2px 0}
#summary{padding:6px 14px;color:var(--mut);border-bottom:1px solid var(--line)}
#map{position:relative;margin:8px 14px;height:calc(100vh - 120px);min-height:520px}
.grp{position:absolute;border:1px solid #000;overflow:hidden}
.gh{position:absolute;left:0;right:0;top:0;height:16px;padding:0 4px;font-size:11px;font-weight:600;background:#21262d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.gh:hover{background:#30363d}
.t{position:absolute;border:1px solid rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#fff;cursor:pointer;text-align:center;line-height:1.1}
.t:hover{outline:2px solid #fff;z-index:2}.t b{font-weight:700}.t i{font-style:normal;opacity:.9}
#tip{position:fixed;pointer-events:none;background:#1c2128;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;display:none;z-index:9;min-width:200px}
#tip .k{color:var(--mut)}#back{display:none}
</style></head><body>
<header><h1>Stock Heatmap</h1>
<div class="ctl">Group <div class="seg" id="g"><button data-v="sector" class="on">Sector</button><button data-v="bi">Broad Industry</button><button data-v="ind">Industry</button></div></div>
<div class="ctl">Size <div class="seg" id="sz"><button data-v="t" class="on">Turnover today</button><button data-v="t20">Avg turnover 20D</button><button data-v="mc">Market cap</button></div></div>
<div class="ctl">Colour <div class="seg" id="cl"><button data-v="r1" class="on">1D</button><button data-v="r5">1W</button><button data-v="r21">1M</button></div></div>
<div class="ctl"><div class="seg" id="rel"><button data-v="abs" class="on">% change</button><button data-v="rel">vs market</button></div></div>
<div class="ctl">Universe <div class="seg" id="fl"><button data-v="1000" class="on">≥ ₹1,000 Cr</button><button data-v="0">All</button></div></div>
<button id="back" class="seg" style="padding:4px 9px;color:var(--tx);cursor:pointer">← All groups</button>
<div id="legend"></div></header>
<div id="summary"></div><div id="map"></div><div id="tip"></div>
<script>
const DATA=/*DATA*/null;
const C=DATA.cols, S=DATA.rows.map(r=>Object.fromEntries(C.map((k,i)=>[k,r[i]])));
const st={g:'sector',sz:'t',cl:'r1',rel:'abs',fl:'1000',focus:null};
const STEPS=[-3,-2,-1,0,1,2,3];
function col(v){if(v==null)return'#3b4250';const a=Math.min(Math.abs(v)/3,1);
 const g=[48,204,90],r=[242,54,69],n=[66,72,84],e=v>=0?g:r;return`rgb(${e.map((x,i)=>Math.round(n[i]+(x-n[i])*a)).join(',')})`}
function median(a){a=a.filter(x=>x!=null).sort((x,y)=>x-y);return a.length?a[a.length>>1]:0}
function squarify(items,x,y,w,h){ // items: [{v,...}] sorted desc; returns with x,y,w,h
 const out=[];let rest=items.slice();const tot=rest.reduce((s,i)=>s+i.v,0);if(!tot)return out;
 const scale=w*h/tot;rest=rest.map(i=>({...i,a:i.v*scale}));
 while(rest.length){const side=Math.min(w,h);let row=[],best=Infinity;
  while(rest.length){const c=row.concat(rest[0]);const s=c.reduce((a,i)=>a+i.a,0);
   const mx=Math.max(...c.map(i=>i.a)),mn=Math.min(...c.map(i=>i.a));
   const worst=Math.max(side*side*mx/(s*s),s*s/(side*side*mn));if(worst<=best){best=worst;row=c;rest.shift()}else break}
  const s=row.reduce((a,i)=>a+i.a,0);
  if(w>=h){const rw=s/h;let yy=y;row.forEach(i=>{const ih=i.a/rw;out.push({...i,x,y:yy,w:rw,h:ih});yy+=ih});x+=rw;w-=rw}
  else{const rh=s/w;let xx=x;row.forEach(i=>{const iw=i.a/rh;out.push({...i,x:xx,y,w:iw,h:rh});xx+=iw});y+=rh;h-=rh}}
 return out}
function fmtCr(v){return v==null?'–':v>=1e5?(v/1e5).toFixed(2)+' L Cr':v>=100?Math.round(v).toLocaleString('en-IN')+' Cr':v.toFixed(1)+' Cr'}
function pct(v){return v==null?'–':(v>0?'+':'')+v.toFixed(2)+'%'}
function render(){
 const map=document.getElementById('map');map.innerHTML='';
 let rows=S.filter(s=>(st.fl==='0'||(s.mc||0)>=1000)&&s[st.g]&&(s[st.sz]||0)>0);
 if(st.focus)rows=rows.filter(s=>s[st.g]===st.focus);
 const mkt=median(S.filter(s=>st.fl==='0'||(s.mc||0)>=1000).map(s=>s[st.cl]));
 const val=s=>s[st.cl]==null?null:(st.rel==='rel'?s[st.cl]-mkt:s[st.cl]);
 const groups={};rows.forEach(s=>(groups[s[st.g]]=groups[s[st.g]]||[]).push(s));
 const gl=Object.entries(groups).map(([k,m])=>({k,m,v:m.reduce((a,s)=>a+s[st.sz],0)})).sort((a,b)=>b.v-a.v);
 const W=map.clientWidth,H=map.clientHeight;
 squarify(gl,0,0,W,H).forEach(g=>{
  const d=document.createElement('div');d.className='grp';Object.assign(d.style,{left:g.x+'px',top:g.y+'px',width:g.w+'px',height:g.h+'px'});
  const tw=g.m.reduce((a,s)=>a+s[st.sz],0),gr=g.m.filter(s=>val(s)!=null).reduce((a,s)=>a+val(s)*s[st.sz],0)/tw;
  const hd=g.h>26&&g.w>40;
  if(hd){const h=document.createElement('div');h.className='gh';h.textContent=`${g.k}  ${pct(gr)}`;h.title='Click to zoom into '+g.k;
   h.onclick=()=>{st.focus=st.focus?null:g.k;render()};d.appendChild(h)}
  const items=g.m.map(s=>({s,v:s[st.sz]})).sort((a,b)=>b.v-a.v);
  squarify(items,0,hd?16:0,g.w-2,g.h-(hd?18:2)).forEach(t=>{
   const e=document.createElement('div');e.className='t';const v=val(t.s);
   Object.assign(e.style,{left:t.x+'px',top:t.y+'px',width:t.w+'px',height:t.h+'px',background:col(v)});
   const fs=Math.max(8,Math.min(22,Math.sqrt(t.w*t.h)/5));
   if(t.w>30&&t.h>16){e.style.fontSize=fs+'px';e.innerHTML=`<b>${t.s.s}</b>`+(t.h>fs*2.6?`<i>${pct(t.s[st.cl])}</i>`:'')}
   e.onmousemove=ev=>tip(ev,t.s,v,mkt);e.onmouseleave=()=>document.getElementById('tip').style.display='none';
   e.onclick=()=>window.open('https://in.tradingview.com/chart/?symbol=NSE:'+encodeURIComponent(t.s.s),'_blank');
   d.appendChild(e)});
  map.appendChild(d)});
 const up=rows.filter(s=>(s[st.cl]||0)>0).length,dn=rows.filter(s=>(s[st.cl]||0)<0).length;
 const tt=rows.reduce((a,s)=>a+(s.t||0),0);
 document.getElementById('summary').textContent=`${DATA.date} · ${rows.length} stocks · ${up} up, ${dn} down · turnover ₹${fmtCr(tt)} · market median ${pct(mkt)} (${{r1:'1D',r5:'1W',r21:'1M'}[st.cl]})`+(st.focus?` · zoomed: ${st.focus}`:'')+' · click a tile for its TradingView chart, a header to zoom';
 document.getElementById('back').style.display=st.focus?'inline-block':'none';
 document.getElementById('legend').innerHTML=STEPS.map(s=>`<span style="background:${col(s)}">${s>0?'+':''}${s}%</span>`).join('');
}
function tip(ev,s,v,mkt){const t=document.getElementById('tip');t.style.display='block';
 t.style.left=Math.min(ev.clientX+14,innerWidth-240)+'px';t.style.top=Math.min(ev.clientY+14,innerHeight-170)+'px';
 t.innerHTML=`<b>${s.s}</b> · ₹${s.c?.toLocaleString('en-IN')}<br><span class="k">${s.sector} › ${s.bi||''} › ${s.ind||''}</span><br>
 1D ${pct(s.r1)} · 1W ${pct(s.r5)} · 1M ${pct(s.r21)}<br>${st.rel==='rel'?`vs market: ${pct(v)}<br>`:''}
 <span class="k">Turnover</span> ₹${fmtCr(s.t)} <span class="k">(20D avg ₹${fmtCr(s.t20)}, ${s.t20?(s.t/s.t20).toFixed(1)+'×':'–'})</span><br><span class="k">Mcap</span> ₹${fmtCr(s.mc)}`}
for(const id of['g','sz','cl','rel','fl'])document.getElementById(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;
 [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));st[id]=b.dataset.v;if(id==='g')st.focus=null;render()};
document.getElementById('back').onclick=()=>{st.focus=null;render()};
addEventListener('resize',render);render();
</script></body></html>
